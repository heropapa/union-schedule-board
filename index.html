<!DOCTYPE html>
<!-- 유니온물류 구 스케쥴 게시판 | 자동배포: GitHub push → Netlify | https://gleaming-mermaid-cc23e0.netlify.app (야간: ?g=night, 링크 없으면 08~20시 주간·그 외 야간) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>유니온물류 스케쥴</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        display: flex; flex-direction: column;
        height: 100vh; height: 100dvh; overflow: hidden;
        background: #f4f5f7; color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    button { font-family: inherit; }
    [hidden] { display: none !important; }

    /* 상단: 제목 + 주간/야간 전환 (한 줄로 → 시트 볼 공간 확보) */
    .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #dfe3e8; }
    .top h1 { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg { flex: none; display: flex; padding: 3px; background: #eef1f4; border-radius: 999px; }
    .seg button { padding: 7px 16px; font-size: 14px; font-weight: 700; color: #555; background: transparent; border: 0; border-radius: 999px; cursor: pointer; }
    .seg button.on { background: #1976d2; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); }

    main { flex: 1; min-height: 0; overflow: auto; }
    #day { height: 100%; }

    /* 주간: 기간 탭 + 스프레드시트 (폰·PC 동일, PC에선 가운데 정렬) */
    .day-view { display: flex; flex-direction: column; height: 100%; max-width: 970px; margin: 0 auto; }
    .mtabs { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f1f1f1; overflow-x: auto; }
    .mtabs .open { flex: none; margin-left: auto; padding: 6px 10px; font-size: 15px; color: #1976d2; text-decoration: none; background: #fff; border: 1px solid #cfd4da; border-radius: 4px; }
    .mtabs button { padding: 8px 12px; font-size: 14px; color: #000; background: #ddd; border: 0; border-radius: 4px; white-space: nowrap; cursor: pointer; }
    .mtabs button.on { background: #aaa; }
    .frames { flex: 1; min-height: 0; position: relative; }
    .frame { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; padding: 10px; overflow: auto; }
    .frame iframe { width: 100%; height: 100%; border: none; transform-origin: top left; }
    /* 주간: [전체스케쥴(어드민) | 휴무백업표] — 휴무백업표는 구글시트 내용을 불러와 4주를 한 화면에 */
    .frame.native { padding: 0; }
    .dwrap { max-width: 760px; margin: 0 auto; padding: 12px; }
    /* 기간 + 보기 전환은 위에 고정 (스크롤해도 그대로) — 스크롤 영역(.frame) 기준 sticky */
    .dbar { position: sticky; top: 0; z-index: 5; display: flex; flex-direction: column; gap: 8px;
            margin: -12px -12px 0; padding: 12px 12px 10px; background: #f4f5f7; box-shadow: 0 6px 6px -6px rgba(0, 0, 0, .18); }
    .dbar .rng { font-size: 15px; font-weight: 700; }
    /* 보기 전환: 기간 탭 위 고정 영역 (스크롤과 무관하게 항상 보임) */
    .dvbar { flex: none; padding: 8px 10px 0; background: #f1f1f1; }
    .dvbar.solo { padding-bottom: 8px; }   /* 전체 스케쥴일 땐 기간 탭이 없어서 */
    .dview { display: flex; padding: 3px; background: #e2e5e9; border-radius: 12px; }
    .dview button { flex: 1 1 0; padding: 7px 10px; font-size: 13px; font-weight: 700; line-height: 1.3; color: #555; word-break: keep-all; background: transparent; border: 0; border-radius: 10px; cursor: pointer; }
    .dview button.on { color: #fff; background: #1976d2; }
    .dsec { margin: 14px 2px 6px; font-size: 14px; font-weight: 700; color: #333; }
    .dsec small { margin-left: 6px; font-size: 11.5px; font-weight: 500; color: #888; }
    .dbox { overflow-x: auto; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; }
    table.dt { width: 100%; min-width: 330px; table-layout: fixed; border-collapse: collapse; background: #fff; }
    /* 이름은 가능한 한 안 쪼갬(keep-all), 칸보다 길 때만 줄바꿈(anywhere) */
    .dt th, .dt td { text-align: center; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; border: 1px solid #e3e6ea; }
    .dt thead th { padding: 5px 1px; font-size: 12px; font-weight: 600; color: #666; background: #fafbfc; }
    .it { display: block; }
    .dt .it.rt { white-space: nowrap; }   /* 713BCD 같은 라우트는 안 쪼갬 */
    .c0, .c6 { background: #ffffcc; }                 /* 일·토 (시트 색) */
    .c1, .c3, .c5 { background: #eef1f4; }           /* 월·수·금 */
    .c2, .c4 { background: #fbe4d5; }                 /* 화·목 */
    /* 휴무백업표: 시트처럼 주별로 이어 붙임 */
    .dt col.lab { width: 52px; }
    .dt th, .dt td { padding: 6px 1px; font-size: 12.5px; }
    .dt thead th .d { display: block; font-size: 14px; font-weight: 700; color: #222; }
    .dt thead th .w { display: block; font-size: 11px; font-weight: 500; }
    .dt thead th.lab { color: #333; background: #eaedf1; }
    .dt thead th.today { color: #fff; background: #1976d2; }
    .dt thead th.today .d { color: #fff; }
    .dt td.today { box-shadow: inset 2px 0 0 #1976d2, inset -2px 0 0 #1976d2; }
    .dt td.lab { font-weight: 600; color: #333; background: #ececec; }
    .dt tr.bk td { background: #fff; }
    .dt tr.bk td.lab { background: #deeaf6; }
    .dt tr.sec td { padding: 4px 1px; font-size: 10.5px; color: #555; background: #d9e2f3; }
    .dt tr.sec td.lab { font-size: 12px; color: #222; background: #bdd6ee; }
    .dfoot { margin: 10px 2px 16px; font-size: 11.5px; line-height: 1.6; color: #999; }
    /* 전체 스케쥴: 쿠팡 어드민처럼 캠프별 사람 × 요일 (야간 표와 같은 모양) */
    #dayFull { flex: 1; min-height: 0; overflow: auto; }
    /* 야간 탭: 위 보기 버튼 고정 + 아래만 스크롤 (주간과 같은 구조) */
    #night { height: 100%; }
    .night-view { display: flex; flex-direction: column; height: 100%; max-width: 970px; margin: 0 auto; }
    #nightMain, #nightAdmin { flex: 1; min-height: 0; overflow: auto; }
    .fnote { margin-top: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.5; color: #7a5b00; background: #fff8e1; border: 1px solid #f3dd9b; border-radius: 10px; }
    .fbar { position: sticky; top: 0; z-index: 5; margin: -12px -12px 0; padding: 12px 12px 10px; background: #f4f5f7; box-shadow: 0 6px 6px -6px rgba(0, 0, 0, .18); }
    .fbar .n-bar { margin-bottom: 0; }
    .ft tr.camp td { padding: 5px 1px; font-size: 10.5px; line-height: 1.3; color: #555; background: #f3f5f8; white-space: normal; }
    .ft tr.camp td.name { padding-left: 9px; font-size: 12.5px; font-weight: 700; color: #333; }
    .ft tr.camp td.name small { display: block; font-size: 10.5px; font-weight: 500; color: #888; }
    .ft tr.camp td b { font-size: 11.5px; color: #1f3864; }
    .ft td .cp { display: block; margin-top: 1px; font-size: 10px; font-weight: 600; color: #6a4c93; }   /* 다른 캠프 라우트 */
    .ft td.off .cp { display: none; }
    .dmsg { padding: 40px 12px; text-align: center; font-size: 15px; color: #666; }
    @media (max-width: 480px) {
        .dwrap { padding: 10px 8px; }
        .dbar, .fbar { margin: -10px -8px 0; padding: 10px 8px 8px; }
        .dvbar { padding: 6px 8px 0; }
        .dvbar.solo { padding-bottom: 6px; }
        .dview button { padding: 6px 6px; font-size: 12.5px; }
        .dt th, .dt td { font-size: 11.5px; letter-spacing: -.3px; }
        .dt col.lab { width: 44px; }
        .dt thead th .d { font-size: 13px; }
    }
    @media (max-width: 380px) {
        .dt th, .dt td { font-size: 11px; letter-spacing: -.5px; }
        .dt col.lab { width: 42px; }
        .ft tr.camp td.name { padding-left: 6px; }
    }
    .loading { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #333; background: rgba(255,255,255,.85); pointer-events: none; }

    /* 야간 */
    .night { max-width: 760px; margin: 0 auto; padding: 12px; }
    .n-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .n-bar .nav { width: 38px; height: 36px; font-size: 15px; background: #fff; border: 1px solid #cfd4da; border-radius: 8px; cursor: pointer; }
    .n-bar .nav:disabled { opacity: .3; cursor: default; }
    .wk { min-width: 120px; text-align: center; font-size: 15px; font-weight: 700; line-height: 1.25; }
    .wk small { display: block; font-size: 11px; font-weight: 500; color: #888; }
    .summary small.pdd { font-size: 12px; color: #888; }
    .todaybtn { height: 36px; padding: 0 12px; font-size: 13px; color: #1976d2; background: #fff; border: 1px solid #1976d2; border-radius: 8px; cursor: pointer; }
    .summary { margin-bottom: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.7; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; }
    .lbl { display: inline-block; margin-right: 5px; padding: 0 7px; font-size: 12px; font-weight: 700; border-radius: 10px; }
    .lbl.off { background: #ffe3e6; color: #9c0006; }
    .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; }
    /* 고정 배치: 이름 칸 폭을 못 박고 날짜 7칸이 나머지를 균등 분할 (자동 배치는 좁은 폰에서 이름 칸이 부풀어 깨짐) */
    table.nt { width: 100%; min-width: 330px; table-layout: fixed; border-collapse: collapse; font-size: 12.5px; }
    .nt th, .nt td { padding: 7px 3px; text-align: center; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #eef0f3; }
    .nt thead th.name { width: 76px; }
    .nt thead th { font-size: 12px; font-weight: 600; color: #666; background: #fafbfc; }
    .nt thead th .d { display: block; font-size: 14px; font-weight: 700; color: #222; }
    .nt thead th .w { display: block; font-size: 11px; font-weight: 500; }
    .nt thead tr.pdd th .d { font-size: 11.5px; font-weight: 600; color: #666; }
    .nt thead tr.pdd th .w { font-size: 10px; }
    .nt thead tr.ip th { padding-bottom: 2px; border-bottom: 0; }
    .nt thead tr.pdd th { padding-top: 1px; font-size: 11px; font-weight: 500; color: #888; }
    .nt thead th.today { color: #fff; background: #1976d2; }
    .nt thead th.today .d { color: #fff; }
    .nt thead tr.pdd th.today, .nt thead tr.pdd th.today .d { color: rgba(255, 255, 255, .9); }
    .nt .name { position: sticky; left: 0; z-index: 1; padding-left: 9px; text-align: left; background: #fff; }
    .nt .name b { display: block; font-size: 13.5px; color: #222; }
    .nt .name small { font-size: 11px; color: #888; }
    .nt tr.team td { padding: 6px 9px; text-align: left; font-weight: 700; color: #444; background: #f3f5f8; }
    .nt td.off { font-weight: 700; color: #9c0006; background: #ffe3e6; }
    .nt td.sub { font-weight: 700; color: #1f3864; background: #e3ecf7; }
    .nt td.today { box-shadow: inset 2px 0 0 #1976d2, inset -2px 0 0 #1976d2; }
    .nt td .rot { display: block; margin-top: 1px; font-size: 10px; font-weight: 600; opacity: .75; }   /* 일부 회전만(D1 등) */
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 2px 4px; font-size: 12px; color: #666; }
    .chip { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; border-radius: 3px; }
    .foot { margin: 6px 2px 16px; font-size: 11.5px; line-height: 1.6; color: #999; }
    @media (max-width: 480px) {   /* 아이폰 Plus/Pro Max(430px)까지 포함해야 520BCD가 안 잘림 */
        .mtabs { gap: 6px; padding: 8px 8px; }
        .mtabs button { padding: 8px 9px; }
        .mtabs .open { padding: 6px 8px; }
        .night { padding: 10px 8px; }
        table.nt { font-size: 11.5px; }
        .nt th, .nt td { padding: 7px 1px; letter-spacing: -.2px; }
        .nt thead th.name { width: 60px; }
    }
    @media (max-width: 340px) { .mtabs .open { display: none; } }   /* 초소형 폰은 탭 3개가 우선 */
    @media (max-width: 380px) {
        .top h1 { font-size: 15px; }
        .seg button { padding: 7px 13px; }
        table.nt { font-size: 11px; }
        .nt th, .nt td { letter-spacing: -.4px; }
        .nt .name { padding-left: 6px; }
        .nt thead th.name { width: 52px; }
    }
</style>
</head>
<body>
<header class="top">
    <h1>🚛 유니온물류 스케쥴</h1>
    <div class="seg" role="tablist" aria-label="근무 구분">
        <button type="button" role="tab" data-g="day">주간</button>
        <button type="button" role="tab" data-g="night">야간</button>
    </div>
</header>

<main>
    <section id="day" hidden>
        <div class="day-view">
            <div class="dvbar" id="dayViewBar"></div>
            <nav class="mtabs" id="dayTabs"></nav>
            <div class="frames" id="dayFrames"></div>
            <div id="dayFull" hidden></div>
        </div>
    </section>
    <section id="night" hidden>
        <div class="night-view">
            <div class="dvbar solo" id="nightViewBar" hidden></div>
            <div id="nightMain"></div>
            <div id="nightAdmin" hidden></div>
        </div>
    </section>
</main>

<script src="night-data.js"></script>
<script src="day-data.js"></script>
<script src="night-admin-data.js"></script>
<script>
(function () {
    // ===================== 여기만 고치면 됩니다 =====================
    // 주간: 시트 하나 = 4주(일~토) 기간. 구글시트 '웹에 게시' 링크 + 그 시트의 첫날/마지막날 (3개 유지)
    //       기간은 python tools/day_range.py <링크> 로 시트에서 자동으로 뽑을 수 있음
    const DAY_SHEETS = [
        { from: '2026-08-16', to: '2026-09-12', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROURhdp0-8yIfXaK7bOQVkqTGChp_oaCgaZY_cPkN4lMqFH60ZU-oTgkZKkx24UZnSMJbRUlfP3Mj1/pubhtml?gid=780158230&single=true' },
        { from: '2026-09-13', to: '2026-10-10', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhHcQAYNAu1bKNHdWQQfOFgwbnoKAgvewnvdqim0pZW1zed1OwpQrat_hpSph3Pq8lEo2XEGikZAOj/pubhtml?gid=780158230&single=true' },
        { from: '2026-10-11', to: '2026-11-07', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1rECnLbI8Mp9yf-kgmhbqo3YrNLH15dBUkD8X_4OpglSKPUZnbwrixEFUpktaO5izAxLgDhGxEca3/pubhtml?gid=780158230&single=true' },
    ];
    // 야간: night-data.js 는 엑셀에서 자동 생성 (tools/convert_night.py)
    // ================================================================

    const SHEET_WIDTH = 930;   // 주간 시트 원래 폭(px) — 이보다 좁은 화면에서만 축소, 넓으면 원래 크기
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    // 로컬 날짜 기준 (toISOString은 UTC라 새벽 0~9시에 하루 전 날짜가 됨)
    const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const now = new Date();
    const TODAY = isoOf(now);
    const WD = ['일', '월', '화', '수', '목', '금', '토'];
    const md = s => { const d = dateOf(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const mdw = s => `${md(s)}(${WD[dateOf(s).getDay()]})`;
    const addDays = (s, n) => { const x = dateOf(s); x.setDate(x.getDate() + n); return isoOf(x); };
    DAY_SHEETS.sort((a, b) => (a.from < b.from ? -1 : 1));

    // ------------------------- 주간 -------------------------
    const embedUrl = u => u.includes('widget=') ? u : u + (u.includes('?') ? '&' : '?') + 'widget=true&headers=false&chrome=false';

    function pickDayIndex() {
        const hit = DAY_SHEETS.findIndex(x => x.from <= TODAY && TODAY <= x.to);   // 오늘이 들어있는 기간
        if (hit >= 0) return hit;
        let best = -1;   // 이미 끝난 기간 중 가장 최근
        DAY_SHEETS.forEach((x, j) => { if (x.to < TODAY && (best < 0 || x.to > DAY_SHEETS[best].to)) best = j; });
        return best >= 0 ? best : 0;   // 전부 미래면 가장 가까운(첫) 기간
    }
    const dayCur = DAY_SHEETS.length ? pickDayIndex() : -1;

    function buildDay() {
        const tabs = document.getElementById('dayTabs');
        const frames = document.getElementById('dayFrames');
        DAY_SHEETS.forEach((x, i) => {
            const label = `${md(x.from)}~${md(x.to)}`;
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = label;
            b.addEventListener('click', () => showDayTab(i));
            tabs.appendChild(b);
            const f = document.createElement('div');
            f.className = 'frame';
            f.hidden = true;
            frames.appendChild(f);
        });
        // 새 창으로 크게 보기 (지금 보는 기간)
        tabs.insertAdjacentHTML('beforeend', '<a class="open" id="dayOpen" target="_blank" rel="noopener" title="새 창으로 크게 보기" aria-label="새 창으로 크게 보기">↗</a>');
    }

    function scaleFrames() {
        const s = Math.min(1, window.innerWidth / SHEET_WIDTH);   // 넓은 화면(PC)에서 확대하지 않음
        document.querySelectorAll('#dayFrames iframe').forEach(ifr => {
            ifr.style.transform = `scale(${s})`;
            ifr.style.width = `${100 / s}%`;
            ifr.style.height = `${100 / s}%`;
        });
    }

    // 주간 표: 구글시트(웹에 게시)의 CSV 를 바로 불러와 그림 → 시트를 고치면 몇 분 안에 여기도 반영.
    //   불러오기·해석이 안 되면 예전처럼 시트 화면(iframe)을 그대로 띄움.
    const csvUrl = u => {
        let gid = '0';
        try { gid = new URL(u).searchParams.get('gid') || '0'; } catch (e) {}
        return `${u.split('/pubhtml')[0]}/pub?gid=${encodeURIComponent(gid)}&single=true&output=csv`;
    };
    function parseCSV(text) {
        const rows = []; let row = [], cell = '', q = false;
        for (let k = 0; k < text.length; k++) {
            const c = text[k];
            if (q) {
                if (c === '"') { if (text[k + 1] === '"') { cell += '"'; k++; } else q = false; }
                else cell += c;
            } else if (c === '"') q = true;
            else if (c === ',') { row.push(cell); cell = ''; }
            else if (c === '\n' || c === '\r') {
                if (c === '\r' && text[k + 1] === '\n') k++;
                row.push(cell); rows.push(row); row = []; cell = '';
            } else cell += c;
        }
        if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
        return rows;
    }
    // 시트 모양: 'A Week' → '휴무자 | 9월 13일 (일) … (토)' → 번호 행 → '백업' → 이름 행 (→ '백업휴무자' 는 읽기만 하고 안 보여줌)
    function parseDaySheet(rows, from) {
        const f0 = dateOf(from), DAY = 864e5;
        const iso = (mo, d) => {   // 표엔 연도가 없음 → 기간 시작일과 가까운 해로
            let x = new Date(f0.getFullYear(), mo - 1, d);
            if (x - f0 > 200 * DAY) x = new Date(f0.getFullYear() - 1, mo - 1, d);
            else if (f0 - x > 200 * DAY) x = new Date(f0.getFullYear() + 1, mo - 1, d);
            return isoOf(x);
        };
        const clean = v => { v = (v || '').trim(); return /^#(N\/A|REF!|VALUE!|NAME\?|DIV\/0!|NULL!|NUM!|ERROR!)$/i.test(v) ? '' : v; };
        const DATE_RE = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/;
        const weeks = [];
        let w = null, sec = null, L = -1, pendingName = '';
        rows.forEach(r => {
            const wk = r.map(c => c.trim()).find(c => /^[A-Z]\s*Week$/i.test(c));
            if (wk) {   // 새 주 시작: 앞 주는 닫음 (머리행을 못 찾은 줄이 앞 주에 섞이지 않게)
                if (pendingName) throw new Error(`${pendingName} 머리행(휴무자 | 날짜)을 못 찾음`);
                pendingName = wk; sec = null; w = null; return;
            }
            const h = r.findIndex((c, j) => c.trim() === '휴무자' && DATE_RE.test(r[j + 1] || ''));
            if (h >= 0) {
                const ds = r.slice(h + 1, h + 8).map(c => DATE_RE.exec(c));
                if (ds.length !== 7 || ds.some(m => !m)) throw new Error('날짜 칸이 7개가 아님');
                L = h;
                w = { name: pendingName || `${weeks.length + 1}주차`, dates: ds.map(m => iso(+m[1], +m[2])), off: [], backup: [], boff: [] };
                weeks.push(w); pendingName = ''; sec = 'off';
                return;
            }
            if (!w || L < 0) return;
            const lab = clean(r[L]);
            if (lab === '백업') { sec = 'bk'; return; }
            if (lab === '백업휴무자') { sec = 'bo'; return; }
            const vals = [];
            for (let k = 1; k <= 7; k++) vals.push(clean(r[L + k]));
            if (!lab && vals.every(v => !v)) return;   // 빈 줄
            if (sec === 'bk') { if (lab) w.backup.push({ name: lab, cells: vals }); }
            else if (sec === 'off' || sec === 'bo') (sec === 'off' ? w.off : w.boff).push({ no: lab, cells: vals });
        });
        if (pendingName) throw new Error(`${pendingName} 머리행(휴무자 | 날짜)을 못 찾음`);
        if (!weeks.length) throw new Error("'휴무자 | 날짜' 머리행을 찾지 못함");
        weeks.forEach(x => {
            for (let k = 1; k < 7; k++) {
                const a = dateOf(x.dates[k - 1]); a.setDate(a.getDate() + 1);
                if (isoOf(a) !== x.dates[k]) throw new Error(`${x.name} 날짜가 이어지지 않음`);
            }
            ['off', 'boff'].forEach(key => {   // 끝쪽 빈 번호 행은 생략 (시트의 빈 칸 11줄 등)
                while (x[key].length > 1 && x[key][x[key].length - 1].cells.every(v => !v)) x[key].pop();
            });
        });
        return weeks;
    }

    // 라우트는 같은 번호끼리 줄여 씀: '516C,516D' → 516CD, '712A,712B,713A' → 712AB / 713A (야간과 같은 표기)
    function toks(v) {   // 같은 번호끼리 모아 글자 순서대로 — '712B,713A,712A' → 712AB / 713A
        const out = [], byNo = {};
        (v || '').split(',').map(t => t.trim()).filter(Boolean).forEach(t => {
            const m = /^(\d{3})([A-Z])$/.exec(t);
            if (!m) { out.push({ t }); return; }
            if (!byNo[m[1]]) { byNo[m[1]] = { p: m[1], s: [] }; out.push(byNo[m[1]]); }
            if (!byNo[m[1]].s.includes(m[2])) byNo[m[1]].s.push(m[2]);
        });
        return out.map(o => (o.t != null ? o.t : o.p + o.s.sort().join('')));
    }
    const items = v => toks(v).map(t => `<span class="it${/^\d{3}[A-Z]+$/.test(t) ? ' rt' : ''}">${esc(t)}</span>`).join('');
    const dnum = s => { const d = dateOf(s); return d.getDate() === 1 ? md(s) : String(d.getDate()); };

    function tableHtml(ws) {   // 표: 시트처럼 주별(휴무자 + 백업)로 위아래 이어 붙임
        const dlab = s => { const d = dateOf(s); return `<span class="d">${dnum(s)}${d.getDate() === 1 ? '' : '일'}</span><span class="w">(${WD[d.getDay()]})</span>`; };
        const mini = s => { const d = dateOf(s); return `${d.getDate()}(${WD[d.getDay()]})`; };
        return ws.map((x, wi) => {
            const cell = (v, d, cls) => `<td class="${cls || ''}${d === TODAY ? ' today' : ''}">${items(v)}</td>`;
            const off = x.off.map(r => `<tr><td class="lab">${esc(r.no)}</td>${r.cells.map((v, k) => cell(v, x.dates[k], 'c' + dateOf(x.dates[k]).getDay())).join('')}</tr>`).join('');
            const bk = x.backup.map(r => `<tr class="bk"><td class="lab">${esc(r.name)}</td>${r.cells.map((v, k) => cell(v, x.dates[k])).join('')}</tr>`).join('');
            return `<div class="dwk" data-wi="${wi}">
                <div class="dsec">${esc(x.name)}<small>${md(x.dates[0])} ~ ${md(x.dates[6])}</small></div>
                <div class="dbox"><table class="dt"><colgroup><col class="lab">${'<col>'.repeat(7)}</colgroup>
                    <thead><tr><th class="lab">휴무자</th>${x.dates.map(d => `<th class="${d === TODAY ? 'today' : ''}">${dlab(d)}</th>`).join('')}</tr></thead>
                    <tbody>${off}<tr class="sec"><td class="lab">백업</td>${x.dates.map(d => `<td class="${d === TODAY ? 'today' : ''}">${mini(d)}</td>`).join('')}</tr>${bk}</tbody>
                </table></div></div>`;
        }).join('');
    }

    const dayData = [];   // 기간별 { weeks, at(불러온 시각), fail, view(그려진 보기) }
    let dayShown = -1;
    const DD = window.DAY_DATA && window.DAY_DATA.dates && window.DAY_DATA.dates.length ? window.DAY_DATA : null;   // 전체 스케쥴 (day-data.js)
    const DAY_VIEWS = [DD && ['full', '전체스케쥴(어드민)'], ['table', '휴무백업표']].filter(Boolean);
    let dayView = store.get('day.view');
    if (!DAY_VIEWS.some(v => v[0] === dayView)) dayView = DD && DD.dates.includes(TODAY) ? 'full' : 'table';
    function loadDay(i) {
        const st = dayData[i] = dayData[i] || {};
        if (st.req) return st.req;
        st.req = fetch(csvUrl(DAY_SHEETS[i].url), { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(t => { st.weeks = parseDaySheet(parseCSV(t), DAY_SHEETS[i].from); st.at = Date.now(); st.fail = false; })
            .catch(e => { if (!st.weeks) st.fail = true; if (window.console) console.warn('주간 시트 불러오기 실패 → 시트 화면으로 대체', e); })
            .then(() => { st.req = null; });
        return st.req;
    }
    function dayFallback(i) {   // 예전 방식: 시트 화면을 축소해서 띄움
        const f = document.querySelectorAll('#dayFrames .frame')[i];
        if (!f || f.querySelector('iframe')) return;
        f.classList.remove('native');
        f.innerHTML = '<div class="loading">로딩중...</div>';
        const ifr = document.createElement('iframe');
        ifr.addEventListener('load', () => { const l = f.querySelector('.loading'); if (l) l.remove(); });
        ifr.src = embedUrl(DAY_SHEETS[i].url);
        f.appendChild(ifr);
        scaleFrames();
    }
    function renderDay(i, keepScroll) {
        const f = document.querySelectorAll('#dayFrames .frame')[i];
        const st = dayData[i];
        if (!f || !st || !st.weeks) return;
        const ws = st.weeks, top = f.scrollTop;
        st.view = dayView;
        f.classList.add('native');
        f.innerHTML = `
            <div class="dwrap">
                <div class="dbar"><span class="rng">${md(ws[0].dates[0])} ~ ${md(ws[ws.length - 1].dates[6])}</span></div>
                ${tableHtml(ws)}
                <div class="dfoot">구글시트에서 바로 불러옵니다 · 시트를 고치면 몇 분 안에 반영 · 라우트는 516C,516D → 516CD 처럼 줄여 표시 · 원본은 오른쪽 위 ↗</div>
            </div>`;
        if (keepScroll) { f.scrollTop = top; return; }
        f.scrollTop = 0;
        {   // 휴무백업표는 이번 주로 바로 이동
            const k = ws.findIndex(x => x.dates.includes(TODAY));
            const el = k > 0 && f.querySelector(`.dwk[data-wi="${k}"]`);
            const bar = f.querySelector('.dbar');
            if (el) f.scrollTop = el.offsetTop - (bar ? bar.offsetHeight : 0) - 4;   // 고정된 윗부분에 안 가리게
        }
    }

    function showDayTab(i) {
        if (i < 0 || i >= DAY_SHEETS.length) return;
        dayShown = i;
        const tabBtns = document.querySelectorAll('#dayTabs button');
        tabBtns.forEach((t, j) => t.classList.toggle('on', j === i));
        if (tabBtns[i] && tabBtns[i].scrollIntoView) tabBtns[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        const frames = document.querySelectorAll('#dayFrames .frame');
        frames.forEach((f, j) => { f.hidden = j !== i; });
        const open = document.getElementById('dayOpen');
        if (open) open.href = embedUrl(DAY_SHEETS[i].url);
        const f = frames[i];
        if (!f || f.querySelector('iframe')) return;   // 이미 시트 화면으로 대체된 기간
        const st = dayData[i];
        if (st && st.weeks) { if (st.view !== dayView) renderDay(i); return; }
        if (!f.querySelector('.dwrap')) f.innerHTML = '<div class="dmsg">불러오는 중…</div>';
        loadDay(i).then(() => {
            if (!dayData[i].weeks) return dayFallback(i);
            // 불러오는 사이 다른 탭·보기·야간으로 갔으면 지금 안 그림 → 돌아올 때 새로 그려서 이번 주로 스크롤
            if (dayShown === i && dayView !== 'full' && !document.getElementById('day').hidden) renderDay(i);
        });
    }
    // 폰에서 게시판을 열어둔 채 다시 볼 때: 3분 넘게 지났으면 시트를 다시 불러와 최신으로 (보던 위치 유지)
    document.addEventListener('visibilitychange', () => {
        const i = dayShown, st = dayData[i];
        if (document.hidden || dayView === 'full' || i < 0 || !st || !st.weeks || Date.now() - st.at < 3 * 60 * 1000) return;
        loadDay(i).then(() => renderDay(i, true));
    });

    // ---- 전체스케쥴(어드민): 쿠팡 어드민처럼 캠프별 사람 × 요일, 주 단위 — 주간·야간 공용 ----
    // DATA = {dates, weeks:[{dates, camps:[{name, people:[{name, days}]}]}]} — 주마다 따로 저장됨
    //   (사람 목록·순서·두 캠프 등록자 위치는 그 주 데이터로만 → 다음 주가 추가돼도 이미 올린 주는 그대로)
    // night: 날짜 = PDD → 머리글 입차/PDD 두 줄, '오늘' = 오늘 저녁 입차하는 칸(PDD 내일)
    function makeFull(el, DATA, night) {
        const weeks = DATA.weeks, key = night ? addDays(TODAY, 1) : TODAY;
        const hit = weeks.findIndex(w => w.dates.includes(key));
        const home = hit >= 0 ? hit : (key < weeks[0].dates[0] ? 0 : weeks.length - 1);
        const sun = addDays(key, -dateOf(key).getDay()), sat = addDays(sun, 6);
        let wi = home;
        const render = () => renderFull(el, DATA, night, weeks, wi, home, hit < 0, key, sun, sat, n => { wi = n; render(); el.scrollTop = 0; });
        return { render, get built() { return el.dataset.wi != null; } };
    }
    function renderFull(el, DATA, night, fullWeeks, fullWi, fullHome, fullNoToday, key, thisSun, thisSat, go) {
        const W = fullWeeks[fullWi], days = W.dates, idx = {};
        days.forEach((d, k) => { idx[d] = k; });
        const lab = s => { const x = dateOf(s); return `<span class="d">${dnum(s)}${x.getDate() === 1 ? '' : '일'}</span><span class="w">(${WD[x.getDay()]})</span>`; };
        const tc = d => (d === key ? ' today' : '');
        let body = '';
        W.camps.forEach(c => {
            const cnt = days.map(d => {   // 출근 = 그날 이 캠프 라우트를 뛴 사람 (어드민 숫자와 같음), 휴 = 이 캠프 사람 중 휴무
                let on = 0, off = 0;
                W.camps.forEach(c2 => c2.people.forEach(p => { const v = p.days[idx[d]]; if (v && v !== '휴' && (v.c || c2.name) === c.name) on++; }));
                c.people.forEach(p => { if (p.days[idx[d]] === '휴') off++; });
                return `<td class="${tc(d).trim()}"><b>${on}</b> 출근<br>휴 ${off}</td>`;
            }).join('');
            body += `<tr class="camp"><td class="name">${esc(c.name)}<small>${c.people.length}명</small></td>${cnt}</tr>`;
            c.people.forEach(p => {
                const cells = days.map(d => {
                    const v = p.days[idx[d]];
                    if (v === '휴') return `<td class="off${tc(d)}">휴</td>`;
                    if (!v) return `<td class="${tc(d).trim()}"></td>`;
                    return `<td class="${tc(d).trim()}">${items(v.r)}${v.t ? `<small class="rot">${esc(v.t)}</small>` : ''}${v.c ? `<small class="cp">${esc(v.c)}</small>` : ''}</td>`;
                }).join('');
                body += `<tr><td class="name"><b>${esc(p.name)}</b></td>${cells}</tr>`;
            });
        });
        const ip = d => addDays(d, -1);   // 야간: 입차 = PDD 전날
        const camps = W.camps.map(c => `${esc(c.name)} ${c.people.length}명`).join(' · ');
        const range = night
            ? `입차 ${md(ip(days[0]))} ~ ${md(ip(days[days.length - 1]))}<small>PDD ${md(days[0])} ~ ${md(days[days.length - 1])} · ${camps}</small>`
            : `${md(days[0])} ~ ${md(days[days.length - 1])}<small>${camps}</small>`;
        const head = night
            ? `<tr class="ip"><th class="name">입차</th>${days.map(d => `<th class="${tc(d).trim()}">${lab(ip(d))}</th>`).join('')}</tr>
               <tr class="pdd"><th class="name">PDD</th>${days.map(d => `<th class="${tc(d).trim()}">${lab(d)}</th>`).join('')}</tr>`
            : `<tr><th class="name">이름</th>${days.map(d => `<th class="${tc(d).trim()}">${lab(d)}</th>`).join('')}</tr>`;
        const first = DATA.dates[0], last = DATA.dates[DATA.dates.length - 1];
        el.innerHTML = `
            <div class="dwrap">
                <div class="fbar"><div class="n-bar">
                    <button type="button" class="nav" data-go="-1" aria-label="이전 주"${fullWi === 0 ? ' disabled' : ''}>◀</button>
                    <span class="wk">${range}</span>
                    <button type="button" class="nav" data-go="1" aria-label="다음 주"${fullWi === fullWeeks.length - 1 ? ' disabled' : ''}>▶</button>
                    ${fullWi !== fullHome ? '<button type="button" class="todaybtn" data-go="home">이번 주</button>' : ''}
                </div></div>
                ${fullNoToday ? `<div class="fnote">${night
                    ? `이번 주(입차 ${md(ip(thisSun))} ~ ${md(ip(thisSat))} · PDD ${md(thisSun)} ~ ${md(thisSat)}) 전체스케쥴(어드민)은 아직 안 올라왔습니다. 위 날짜를 확인하시고, 이번 주는 야간 근무표를 봐 주세요.`
                    : `이번 주(${md(thisSun)} ~ ${md(thisSat)}) 전체스케쥴(어드민)은 아직 안 올라왔습니다. 위 날짜를 확인하시고, 이번 주는 휴무백업표를 봐 주세요.`}</div>` : ''}
                <div class="tbl-wrap" style="margin-top:10px">
                    <table class="nt ft">
                        <thead>${head}</thead>
                        <tbody>${body}</tbody>
                    </table>
                </div>
                <div class="legend">
                    <span><i class="chip" style="background:#ffe3e6;border:1px solid #f5a3ad"></i>휴무</span>
                    <span><b style="font-size:11px">${night ? 'D1' : '2회전'}</b> 한 라우트를 나눠 뛴 날</span>
                    <span><b style="font-size:11px;color:#6a4c93">부산2</b> 다른 캠프 라우트</span>
                </div>
                <div class="dfoot">${night
                    ? `쿠팡 어드민 야간 스케쥴 기준 · PDD ${md(first)} ~ ${md(last)} 등록 (입차는 그 전날 저녁) · 야간 근무표와 같은 공개 범위`
                    : `쿠팡 어드민 스케쥴(유스프에서 뽑은 엑셀) 기준 · ${md(first)} ~ ${md(last)} 등록`} · 라우트는 ${night ? '520B,520C,520D → 520BCD' : '516C,516D → 516CD'} 처럼 줄여 표시 · 두 캠프에 등록된 사람은 그 주에 출근이 많은 캠프에 한 번만</div>
            </div>`;
        el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
            const g = b.dataset.go;
            go(g === 'home' ? fullHome : Math.max(0, Math.min(fullWeeks.length - 1, fullWi + Number(g))));
        }));
        el.dataset.wi = String(fullWi);
    }
    const dayFull = DD ? makeFull(document.getElementById('dayFull'), DD, false) : null;

    function buildDayViews() {
        const bar = document.getElementById('dayViewBar');
        bar.innerHTML = `<div class="dview" role="tablist" aria-label="보기 방식">${DAY_VIEWS.map(([v, label]) =>
            `<button type="button" data-v="${v}">${label}</button>`).join('')}</div>`;
        bar.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.v === dayView) return;
            dayView = b.dataset.v;
            store.set('day.view', dayView);
            ensureDayTab();
        }));
    }
    function ensureDayTab() {   // 지금 보기에 맞게 화면 구성 (전체 스케쥴 ↔ 기간 탭 + 시트 보기)
        document.querySelectorAll('#dayViewBar [data-v]').forEach(b => {
            const on = b.dataset.v === dayView;
            b.classList.toggle('on', on);
            b.setAttribute('aria-selected', on);
        });
        const full = dayView === 'full';
        document.getElementById('dayViewBar').classList.toggle('solo', full);
        document.getElementById('dayTabs').hidden = full;
        document.getElementById('dayFrames').hidden = full;
        document.getElementById('dayFull').hidden = !full;
        if (full) {
            if (!dayFull.built) dayFull.render();
            return;
        }
        if (dayCur < 0) return;
        const on = document.querySelector('#dayTabs button.on');
        showDayTab(on ? [...document.querySelectorAll('#dayTabs button')].indexOf(on) : dayCur);
    }

    // ------------------------- 야간 -------------------------
    // 야간 보기: [야간 근무표 | 전체스케쥴(어드민)] — 어드민 데이터(night-admin-data.js)가 있을 때만 버튼이 보임
    const NA = window.NIGHT_ADMIN && window.NIGHT_ADMIN.weeks && window.NIGHT_ADMIN.weeks.length ? window.NIGHT_ADMIN : null;
    const nightFull = NA ? makeFull(document.getElementById('nightAdmin'), NA, true) : null;
    let nightView = NA && store.get('night.view') === 'admin' ? 'admin' : 'main';
    function buildNightViews() {
        if (!NA) return;
        const bar = document.getElementById('nightViewBar');
        bar.hidden = false;
        bar.innerHTML = `<div class="dview" role="tablist" aria-label="보기 방식">
            <button type="button" data-v="main">야간 근무표</button><button type="button" data-v="admin">전체스케쥴(어드민)</button></div>`;
        bar.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.v === nightView) return;
            nightView = b.dataset.v;
            store.set('night.view', nightView);
            applyNightView();
        }));
        applyNightView();
    }
    function applyNightView() {
        document.querySelectorAll('#nightViewBar [data-v]').forEach(b => {
            const on = b.dataset.v === nightView;
            b.classList.toggle('on', on);
            b.setAttribute('aria-selected', on);
        });
        document.getElementById('nightMain').hidden = nightView !== 'main';
        document.getElementById('nightAdmin').hidden = nightView !== 'admin';
        if (nightView === 'admin' && !nightFull.built) nightFull.render();
    }

    function buildNight() {
        const root = document.getElementById('nightMain');
        const D = window.NIGHT_DATA;
        if (!D || !D.dates || !D.dates.length) {
            root.innerHTML = '<div class="night"><div class="summary">야간 근무표를 불러오지 못했습니다.</div></div>';
            return;
        }
        const first = D.dates[0], last = D.dates[D.dates.length - 1];
        const idx = {};
        D.dates.forEach((d, i) => { idx[d] = i; });
        const people = [].concat(...D.teams.map(t => t.people));
        const valOf = (p, d) => (d in idx ? p.days[idx[d]] : null);
        const roleAt = (p, d) => (p.roles && d in idx && p.roles[idx[d]]) || p.role;   // 달마다 담당이 바뀐 경우
        const splitRot = v => { const m = /^(.+)\((.+)\)$/.exec(v || ''); return m ? [m[1], m[2]] : [v, '']; };   // '708B(D1)' → ['708B','D1']
        // 근무표 날짜 = PDD. 입차는 그 전날 저녁 (예: PDD 10/1 = 9/30 입차)
        const shift = (s, n) => { const x = dateOf(s); x.setDate(x.getDate() + n); return isoOf(x); };
        const ipOf = d => shift(d, -1);
        const TONIGHT = shift(TODAY, 1);   // 오늘 저녁 입차하는 근무의 PDD
        // 머리글 한 칸: '31일' + '(토)', 달이 바뀌는 1일은 '11/1' + '(일)'
        const dlab = s => { const x = dateOf(s); return `<span class="d">${x.getDate() === 1 ? md(s) : x.getDate() + '일'}</span><span class="w">(${WD[x.getDay()]})</span>`; };

        // 일요일 시작 주 단위
        const weeks = [];
        const s0 = dateOf(first);
        s0.setDate(s0.getDate() - s0.getDay());
        for (const w = new Date(s0); isoOf(w) <= last; w.setDate(w.getDate() + 7)) {
            const days = [];
            for (let k = 0; k < 7; k++) { const x = new Date(w); x.setDate(w.getDate() + k); days.push(isoOf(x)); }
            weeks.push(days);
        }
        const before = TONIGHT < first, after = TONIGHT > last;
        const homeWeek = before ? 0 : after ? weeks.length - 1 : weeks.findIndex(w => w.includes(TONIGHT));
        let wi = homeWeek;
        try { localStorage.removeItem('night.me'); } catch (e) {}   // 없앤 '내 이름' 기능의 저장값 정리

        function summary() {
            if (before) return `근무표는 <b>${mdw(ipOf(first))} 입차</b>부터 시작합니다. 첫 주를 보여드려요.`;
            if (after) return `등록된 근무표는 <b>${mdw(ipOf(last))} 입차</b>까지입니다. 새 근무표가 올라오면 바뀝니다.`;
            const offs = people.filter(p => valOf(p, TONIGHT) === '휴').map(p => esc(p.name));
            const working = people.filter(p => { const v = valOf(p, TONIGHT); return v && v !== '휴'; }).length;
            let html = `오늘 입차 <b>${mdw(TODAY)}</b> <small class="pdd">PDD ${mdw(TONIGHT)}</small> · 근무 ${working}명`;
            if (offs.length) html += `<br><span class="lbl off">휴무</span>${offs.join(', ')}`;
            return html;
        }

        function render() {
            const days = weeks[wi].filter(d => first <= d && d <= last);   // 범위 밖(공개 전) 날짜는 칸째 숨김
            const tcls = d => (d === TONIGHT ? ' class="today"' : '');
            const headIp = days.map(d => `<th${tcls(d)}>${dlab(ipOf(d))}</th>`).join('');
            const headPdd = days.map(d => `<th${tcls(d)}>${dlab(d)}</th>`).join('');
            let body = '';
            D.teams.forEach(t => {
                body += `<tr class="team"><td colspan="${days.length + 1}">${esc(t.name)}</td></tr>`;
                t.people.forEach(p => {
                    const cells = days.map(d => {
                        const v = valOf(p, d);
                        const cls = [];
                        if (v === '휴') cls.push('off');
                        else if (v && splitRot(v)[0] !== roleAt(p, d)) cls.push('sub');   // 본인 담당과 다르면 대체(파랑)
                        if (d === TONIGHT) cls.push('today');
                        const [rt, rot] = splitRot(v);
                        return `<td class="${cls.join(' ')}">${v == null ? '' : esc(rt) + (rot ? `<small class="rot">${esc(rot)}</small>` : '')}</td>`;
                    }).join('');
                    body += `<tr><td class="name"><b>${esc(p.name)}</b><small>${esc(roleAt(p, days[Math.min(3, days.length - 1)]))}</small></td>${cells}</tr>`;
                });
            });

            root.innerHTML = `
            <div class="night">
                <div class="n-bar">
                    <button type="button" class="nav" id="nPrev" aria-label="이전 주"${wi === 0 ? ' disabled' : ''}>◀</button>
                    <span class="wk">입차 ${md(ipOf(days[0]))} ~ ${md(ipOf(days[days.length - 1]))}<small>PDD ${md(days[0])} ~ ${md(days[days.length - 1])}</small></span>
                    <button type="button" class="nav" id="nNext" aria-label="다음 주"${wi === weeks.length - 1 ? ' disabled' : ''}>▶</button>
                    ${wi !== homeWeek ? '<button type="button" class="todaybtn" id="nToday">이번 주</button>' : ''}
                </div>
                <div class="summary">${summary()}</div>
                <div class="tbl-wrap">
                    <table class="nt">
                        <thead>
                            <tr class="ip"><th class="name">입차</th>${headIp}</tr>
                            <tr class="pdd"><th class="name">PDD</th>${headPdd}</tr>
                        </thead>
                        <tbody>${body}</tbody>
                    </table>
                </div>
                <div class="legend">
                    <span><i class="chip" style="background:#ffe3e6;border:1px solid #f5a3ad"></i>휴무</span>
                    <span><i class="chip" style="background:#e3ecf7;border:1px solid #9fb7da"></i>백업·대체 노선</span>
                    <span><i class="chip" style="background:#fff;border:2px solid #1976d2"></i>오늘 입차</span>
                </div>
                <div class="foot">${esc(D.title)} · 입차 ${md(ipOf(first))} ~ ${md(ipOf(last))} (PDD ${md(first)} ~ ${md(last)})${D.until ? ' · 이후 근무는 확정되면 올립니다' : ''}${D.note ? '<br>' + esc(D.note) : ''}</div>
            </div>`;

            document.getElementById('nPrev').onclick = () => { if (wi > 0) { wi--; render(); } };
            document.getElementById('nNext').onclick = () => { if (wi < weeks.length - 1) { wi++; render(); } };
            const tb = document.getElementById('nToday');
            if (tb) tb.onclick = () => { wi = homeWeek; render(); };
        }
        render();
    }

    // ---------------------- 주간/야간 전환 ----------------------
    // 단톡방 전용 링크: ?g=night (야간) / ?g=day (주간)
    const G_ALIAS = { day: 'day', d: 'day', '주간': 'day', night: 'night', n: 'night', '야간': 'night' };
    function initialGroup() {
        let q = null;
        try { q = (new URLSearchParams(location.search).get('g') || '').toLowerCase(); } catch (e) {}
        if (q && G_ALIAS[q]) return G_ALIAS[q];
        const h = now.getHours();   // 들어올 때 시간 기준: 오전 8시 ~ 저녁 8시 전 주간, 그 외 야간 (사장님 요청)
        return h >= 8 && h < 20 ? 'day' : 'night';
    }
    function setGroup(g, fromClick) {
        document.querySelectorAll('.seg button').forEach(b => {
            const on = b.dataset.g === g;
            b.classList.toggle('on', on);
            b.setAttribute('aria-selected', on);
        });
        document.getElementById('day').hidden = g !== 'day';
        document.getElementById('night').hidden = g !== 'night';
        if (fromClick) {   // 탭을 눌러 바꾸면 주소의 ?g= 를 지움 → 새로고침·다음 날 다시 열 때도 시간 기준대로
            try { const u = new URL(location.href); if (u.searchParams.has('g')) { u.searchParams.delete('g'); history.replaceState(null, '', u.pathname + u.search + u.hash); } } catch (e) {}
        }
        if (g === 'day') ensureDayTab();
        document.querySelector('main').scrollTop = 0;
    }

    buildDay();
    buildDayViews();
    try { buildNight(); } catch (e) {
        document.getElementById('nightMain').innerHTML = '<div class="night"><div class="summary">야간 근무표를 표시하지 못했습니다.</div></div>';
    }
    try { buildNightViews(); } catch (e) {}
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setGroup(b.dataset.g, true)));
    setGroup(initialGroup(), false);
    window.addEventListener('resize', () => {
        scaleFrames();
        if (!document.getElementById('day').hidden) ensureDayTab();
    });

    // 폰에서 탭을 열어둔 채 날짜가 바뀌면 '오늘/내일'이 어제 기준으로 남으므로, 돌아올 때·1분마다 확인해 새로고침
    const recheck = () => { if (isoOf(new Date()) !== TODAY) location.reload(); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
    window.addEventListener('pageshow', e => { if (e.persisted) recheck(); });
    setInterval(recheck, 60 * 1000);
})();
</script>
</body>
</html>
