<!DOCTYPE html>
<!-- 유니온물류 구 스케쥴 게시판 | 자동배포: GitHub push → Netlify | https://gleaming-mermaid-cc23e0.netlify.app (야간: ?g=night) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>유니온물류 스케쥴</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        display: flex; flex-direction: column;
        height: 100vh; height: 100dvh; overflow: hidden;
        background: #f4f5f7; color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    button { font-family: inherit; }
    [hidden] { display: none !important; }

    /* 상단: 제목 + 주간/야간 전환 (한 줄로 → 시트 볼 공간 확보) */
    .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #dfe3e8; }
    .top h1 { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg { flex: none; display: flex; padding: 3px; background: #eef1f4; border-radius: 999px; }
    .seg button { padding: 7px 16px; font-size: 14px; font-weight: 700; color: #555; background: transparent; border: 0; border-radius: 999px; cursor: pointer; }
    .seg button.on { background: #1976d2; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); }

    main { flex: 1; min-height: 0; overflow: auto; }
    #day { height: 100%; }

    /* 주간: 기간 탭 + 스프레드시트 (폰·PC 동일, PC에선 가운데 정렬) */
    .day-view { display: flex; flex-direction: column; height: 100%; max-width: 970px; margin: 0 auto; }
    .mtabs { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f1f1f1; overflow-x: auto; }
    .mtabs .open { flex: none; margin-left: auto; padding: 6px 10px; font-size: 15px; color: #1976d2; text-decoration: none; background: #fff; border: 1px solid #cfd4da; border-radius: 4px; }
    .mtabs button { padding: 8px 12px; font-size: 14px; color: #000; background: #ddd; border: 0; border-radius: 4px; white-space: nowrap; cursor: pointer; }
    .mtabs button.on { background: #aaa; }
    .frames { flex: 1; min-height: 0; position: relative; }
    .frame { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; padding: 10px; overflow: auto; }
    .frame iframe { width: 100%; height: 100%; border: none; transform-origin: top left; }
    .loading { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #333; background: rgba(255,255,255,.85); pointer-events: none; }

    /* 야간 */
    .night { max-width: 760px; margin: 0 auto; padding: 12px; }
    .n-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .n-bar .nav { width: 38px; height: 36px; font-size: 15px; background: #fff; border: 1px solid #cfd4da; border-radius: 8px; cursor: pointer; }
    .n-bar .nav:disabled { opacity: .3; cursor: default; }
    .wk { min-width: 120px; text-align: center; font-size: 15px; font-weight: 700; }
    .todaybtn { height: 36px; padding: 0 12px; font-size: 13px; color: #1976d2; background: #fff; border: 1px solid #1976d2; border-radius: 8px; cursor: pointer; }
    .summary { margin-bottom: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.7; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; }
    .lbl { display: inline-block; margin-right: 5px; padding: 0 7px; font-size: 12px; font-weight: 700; border-radius: 10px; }
    .lbl.off { background: #ffe3e6; color: #9c0006; }
    .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; }
    /* 고정 배치: 이름 칸 폭을 못 박고 날짜 7칸이 나머지를 균등 분할 (자동 배치는 좁은 폰에서 이름 칸이 부풀어 깨짐) */
    table.nt { width: 100%; min-width: 330px; table-layout: fixed; border-collapse: collapse; font-size: 12.5px; }
    .nt th, .nt td { padding: 7px 3px; text-align: center; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #eef0f3; }
    .nt thead th.name { width: 76px; }
    .nt thead th.cnt-h { width: 44px; }
    .nt thead th { font-size: 12px; font-weight: 600; color: #666; background: #fafbfc; }
    .nt thead th .d { display: block; font-size: 14px; font-weight: 700; color: #222; }
    .nt thead th.today { color: #fff; background: #1976d2; }
    .nt thead th.today .d { color: #fff; }
    .nt .name { position: sticky; left: 0; z-index: 1; padding-left: 9px; text-align: left; background: #fff; }
    .nt .name b { display: block; font-size: 13.5px; color: #222; }
    .nt .name small { font-size: 11px; color: #888; }
    .nt tr.team td { padding: 6px 9px; text-align: left; font-weight: 700; color: #444; background: #f3f5f8; }
    .nt td.off { font-weight: 700; color: #9c0006; background: #ffe3e6; }
    .nt td.sub { font-weight: 700; color: #1f3864; background: #e3ecf7; }
    .nt td.today { box-shadow: inset 2px 0 0 #1976d2, inset -2px 0 0 #1976d2; }
    .nt .cnt { font-size: 11.5px; color: #777; }
    .nt td .rot { display: block; margin-top: 1px; font-size: 10px; font-weight: 600; opacity: .75; }   /* 일부 회전만(D1 등) */
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 2px 4px; font-size: 12px; color: #666; }
    .chip { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; border-radius: 3px; }
    .foot { margin: 6px 2px 16px; font-size: 11.5px; line-height: 1.6; color: #999; }
    @media (max-width: 480px) {   /* 아이폰 Plus/Pro Max(430px)까지 포함해야 520BCD가 안 잘림 */
        .mtabs { gap: 6px; padding: 8px 8px; }
        .mtabs button { padding: 8px 9px; }
        .mtabs .open { padding: 6px 8px; }
        .night { padding: 10px 8px; }
        table.nt { font-size: 11.5px; }
        .nt th, .nt td { padding: 7px 1px; letter-spacing: -.2px; }
        .nt thead th.name { width: 60px; }
    }
    @media (max-width: 340px) { .mtabs .open { display: none; } }   /* 초소형 폰은 탭 3개가 우선 */
    @media (max-width: 380px) {
        .top h1 { font-size: 15px; }
        .seg button { padding: 7px 13px; }
        table.nt { font-size: 11px; }
        .nt th, .nt td { letter-spacing: -.4px; }
        .nt .name { padding-left: 6px; }
        .nt thead th.name { width: 52px; }
    }
</style>
</head>
<body>
<header class="top">
    <h1>🚛 유니온물류 스케쥴</h1>
    <div class="seg" role="tablist" aria-label="근무 구분">
        <button type="button" role="tab" data-g="day">주간</button>
        <button type="button" role="tab" data-g="night">야간</button>
    </div>
</header>

<main>
    <section id="day" hidden>
        <div class="day-view">
            <nav class="mtabs" id="dayTabs"></nav>
            <div class="frames" id="dayFrames"></div>
        </div>
    </section>
    <section id="night" hidden></section>
</main>

<script src="night-data.js"></script>
<script>
(function () {
    // ===================== 여기만 고치면 됩니다 =====================
    // 주간: 시트 하나 = 4주(일~토) 기간. 구글시트 '웹에 게시' 링크 + 그 시트의 첫날/마지막날 (3개 유지)
    //       기간은 python tools/day_range.py <링크> 로 시트에서 자동으로 뽑을 수 있음
    const DAY_SHEETS = [
        { from: '2026-08-16', to: '2026-09-12', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROURhdp0-8yIfXaK7bOQVkqTGChp_oaCgaZY_cPkN4lMqFH60ZU-oTgkZKkx24UZnSMJbRUlfP3Mj1/pubhtml?gid=780158230&single=true' },
        { from: '2026-09-13', to: '2026-10-10', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhHcQAYNAu1bKNHdWQQfOFgwbnoKAgvewnvdqim0pZW1zed1OwpQrat_hpSph3Pq8lEo2XEGikZAOj/pubhtml?gid=780158230&single=true' },
        { from: '2026-10-11', to: '2026-11-07', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1rECnLbI8Mp9yf-kgmhbqo3YrNLH15dBUkD8X_4OpglSKPUZnbwrixEFUpktaO5izAxLgDhGxEca3/pubhtml?gid=780158230&single=true' },
    ];
    // 야간: night-data.js 는 엑셀에서 자동 생성 (tools/convert_night.py)
    // ================================================================

    const SHEET_WIDTH = 930;   // 주간 시트 원래 폭(px) — 이보다 좁은 화면에서만 축소, 넓으면 원래 크기
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0');
    // 로컬 날짜 기준 (toISOString은 UTC라 새벽 0~9시에 하루 전 날짜가 됨)
    const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const now = new Date();
    const TODAY = isoOf(now);
    const WD = ['일', '월', '화', '수', '목', '금', '토'];
    const md = s => { const d = dateOf(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const mdw = s => `${md(s)}(${WD[dateOf(s).getDay()]})`;
    DAY_SHEETS.sort((a, b) => (a.from < b.from ? -1 : 1));

    // ------------------------- 주간 -------------------------
    const embedUrl = u => u.includes('widget=') ? u : u + (u.includes('?') ? '&' : '?') + 'widget=true&headers=false&chrome=false';

    function pickDayIndex() {
        const hit = DAY_SHEETS.findIndex(x => x.from <= TODAY && TODAY <= x.to);   // 오늘이 들어있는 기간
        if (hit >= 0) return hit;
        let best = -1;   // 이미 끝난 기간 중 가장 최근
        DAY_SHEETS.forEach((x, j) => { if (x.to < TODAY && (best < 0 || x.to > DAY_SHEETS[best].to)) best = j; });
        return best >= 0 ? best : 0;   // 전부 미래면 가장 가까운(첫) 기간
    }
    const dayCur = DAY_SHEETS.length ? pickDayIndex() : -1;

    function buildDay() {
        const tabs = document.getElementById('dayTabs');
        const frames = document.getElementById('dayFrames');
        DAY_SHEETS.forEach((x, i) => {
            const label = `${md(x.from)}~${md(x.to)}`;
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = label;
            b.addEventListener('click', () => showDayTab(i));
            tabs.appendChild(b);
            const f = document.createElement('div');
            f.className = 'frame';
            f.hidden = true;
            frames.appendChild(f);
        });
        // 새 창으로 크게 보기 (지금 보는 기간)
        tabs.insertAdjacentHTML('beforeend', '<a class="open" id="dayOpen" target="_blank" rel="noopener" title="새 창으로 크게 보기" aria-label="새 창으로 크게 보기">↗</a>');
    }

    function scaleFrames() {
        const s = Math.min(1, window.innerWidth / SHEET_WIDTH);   // 넓은 화면(PC)에서 확대하지 않음
        document.querySelectorAll('#dayFrames iframe').forEach(ifr => {
            ifr.style.transform = `scale(${s})`;
            ifr.style.width = `${100 / s}%`;
            ifr.style.height = `${100 / s}%`;
        });
    }

    function showDayTab(i) {
        const tabBtns = document.querySelectorAll('#dayTabs button');
        tabBtns.forEach((t, j) => t.classList.toggle('on', j === i));
        if (tabBtns[i] && tabBtns[i].scrollIntoView) tabBtns[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        const frames = document.querySelectorAll('#dayFrames .frame');
        frames.forEach((f, j) => { f.hidden = j !== i; });
        const open = document.getElementById('dayOpen');
        if (open) open.href = embedUrl(DAY_SHEETS[i].url);
        const f = frames[i];
        if (f && !f.querySelector('iframe')) {   // 처음 볼 때만 불러옴 (안 보는 달은 로딩 안 함)
            f.innerHTML = '<div class="loading">로딩중...</div>';
            const ifr = document.createElement('iframe');
            ifr.addEventListener('load', () => { const l = f.querySelector('.loading'); if (l) l.remove(); });
            ifr.src = embedUrl(DAY_SHEETS[i].url);
            f.appendChild(ifr);
            scaleFrames();
        }
    }

    function ensureDayTab() {
        if (dayCur < 0) return;
        if (!document.querySelector('#dayTabs button.on')) showDayTab(dayCur);
    }

    // ------------------------- 야간 -------------------------
    function buildNight() {
        const root = document.getElementById('night');
        const D = window.NIGHT_DATA;
        if (!D || !D.dates || !D.dates.length) {
            root.innerHTML = '<div class="night"><div class="summary">야간 근무표를 불러오지 못했습니다.</div></div>';
            return;
        }
        const first = D.dates[0], last = D.dates[D.dates.length - 1];
        const idx = {};
        D.dates.forEach((d, i) => { idx[d] = i; });
        const people = [].concat(...D.teams.map(t => t.people));
        const valOf = (p, d) => (d in idx ? p.days[idx[d]] : null);
        const roleAt = (p, d) => (p.roles && d in idx && p.roles[idx[d]]) || p.role;   // 달마다 담당이 바뀐 경우
        const splitRot = v => { const m = /^(.+)\((.+)\)$/.exec(v || ''); return m ? [m[1], m[2]] : [v, '']; };   // '708B(D1)' → ['708B','D1']

        // 일요일 시작 주 단위
        const weeks = [];
        const s0 = dateOf(first);
        s0.setDate(s0.getDate() - s0.getDay());
        for (const w = new Date(s0); isoOf(w) <= last; w.setDate(w.getDate() + 7)) {
            const days = [];
            for (let k = 0; k < 7; k++) { const x = new Date(w); x.setDate(w.getDate() + k); days.push(isoOf(x)); }
            weeks.push(days);
        }
        const before = TODAY < first, after = TODAY > last;
        const homeWeek = before ? 0 : after ? weeks.length - 1 : weeks.findIndex(w => w.includes(TODAY));
        let wi = homeWeek;
        try { localStorage.removeItem('night.me'); } catch (e) {}   // 없앤 '내 이름' 기능의 저장값 정리

        function summary() {
            if (before) return `근무표는 <b>${mdw(first)}</b>부터 시작합니다. 첫 주를 보여드려요.`;
            if (after) return `등록된 근무표는 <b>${mdw(last)}</b>까지입니다. 새 근무표가 올라오면 바뀝니다.`;
            const offs = people.filter(p => valOf(p, TODAY) === '휴').map(p => esc(p.name));
            const working = people.filter(p => { const v = valOf(p, TODAY); return v && v !== '휴'; }).length;
            let html = `오늘 <b>${mdw(TODAY)}</b> · 근무 ${working}명`;
            if (offs.length) html += `<br><span class="lbl off">휴무</span>${offs.join(', ')}`;
            return html;
        }

        const wideEnough = () => window.innerWidth >= 600;   // 폰에선 '근무' 칸 생략
        let showCnt = wideEnough();
        window.addEventListener('resize', () => { if (wideEnough() !== showCnt) { showCnt = wideEnough(); render(); } });

        function render() {
            const days = weeks[wi];
            const head = days.map(d => {
                const dt = dateOf(d);
                return `<th class="${d === TODAY ? 'today' : ''}">${WD[dt.getDay()]}<span class="d">${dt.getDate()}</span></th>`;
            }).join('');
            let body = '';
            D.teams.forEach(t => {
                body += `<tr class="team"><td colspan="${showCnt ? 9 : 8}">${esc(t.name)}</td></tr>`;
                t.people.forEach(p => {
                    let work = 0;
                    const cells = days.map(d => {
                        const v = valOf(p, d);
                        const cls = [];
                        if (v === '휴') cls.push('off');
                        else if (v && splitRot(v)[0] !== roleAt(p, d)) cls.push('sub');   // 본인 담당과 다르면 대체(파랑)
                        if (v && v !== '휴') work++;
                        if (d === TODAY) cls.push('today');
                        const [rt, rot] = splitRot(v);
                        return `<td class="${cls.join(' ')}">${v == null ? '' : esc(rt) + (rot ? `<small class="rot">${esc(rot)}</small>` : '')}</td>`;
                    }).join('');
                    body += `<tr><td class="name"><b>${esc(p.name)}</b><small>${esc(roleAt(p, days[3]))}</small></td>${cells}${showCnt ? `<td class="cnt">${work}</td>` : ''}</tr>`;
                });
            });

            root.innerHTML = `
            <div class="night">
                <div class="n-bar">
                    <button type="button" class="nav" id="nPrev" aria-label="이전 주"${wi === 0 ? ' disabled' : ''}>◀</button>
                    <span class="wk">${md(days[0])} ~ ${md(days[6])}</span>
                    <button type="button" class="nav" id="nNext" aria-label="다음 주"${wi === weeks.length - 1 ? ' disabled' : ''}>▶</button>
                    ${wi !== homeWeek ? '<button type="button" class="todaybtn" id="nToday">이번 주</button>' : ''}
                </div>
                <div class="summary">${summary()}</div>
                <div class="tbl-wrap">
                    <table class="nt">
                        <thead><tr><th class="name">이름</th>${head}${showCnt ? '<th class="cnt-h">근무</th>' : ''}</tr></thead>
                        <tbody>${body}</tbody>
                    </table>
                </div>
                <div class="legend">
                    <span><i class="chip" style="background:#ffe3e6;border:1px solid #f5a3ad"></i>휴무</span>
                    <span><i class="chip" style="background:#e3ecf7;border:1px solid #9fb7da"></i>백업·대체 노선</span>
                    <span><i class="chip" style="background:#fff;border:2px solid #1976d2"></i>오늘</span>
                </div>
                <div class="foot">${esc(D.title)} · ${md(first)} ~ ${md(last)}${D.note ? '<br>' + esc(D.note) : ''}</div>
            </div>`;

            document.getElementById('nPrev').onclick = () => { if (wi > 0) { wi--; render(); } };
            document.getElementById('nNext').onclick = () => { if (wi < weeks.length - 1) { wi++; render(); } };
            const tb = document.getElementById('nToday');
            if (tb) tb.onclick = () => { wi = homeWeek; render(); };
        }
        render();
    }

    // ---------------------- 주간/야간 전환 ----------------------
    // 단톡방 전용 링크: ?g=night (야간) / ?g=day (주간)
    const G_ALIAS = { day: 'day', d: 'day', '주간': 'day', night: 'night', n: 'night', '야간': 'night' };
    function initialGroup() {
        let q = null;
        try { q = (new URLSearchParams(location.search).get('g') || '').toLowerCase(); } catch (e) {}
        if (q && G_ALIAS[q]) return G_ALIAS[q];
        return store.get('group') === 'night' ? 'night' : 'day';
    }
    function setGroup(g, fromClick) {
        document.querySelectorAll('.seg button').forEach(b => {
            const on = b.dataset.g === g;
            b.classList.toggle('on', on);
            b.setAttribute('aria-selected', on);
        });
        document.getElementById('day').hidden = g !== 'day';
        document.getElementById('night').hidden = g !== 'night';
        store.set('group', g);
        if (fromClick) { try { history.replaceState(null, '', '?g=' + g); } catch (e) {} }
        if (g === 'day') ensureDayTab();
        document.querySelector('main').scrollTop = 0;
    }

    buildDay();
    try { buildNight(); } catch (e) {
        document.getElementById('night').innerHTML = '<div class="night"><div class="summary">야간 근무표를 표시하지 못했습니다.</div></div>';
    }
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setGroup(b.dataset.g, true)));
    setGroup(initialGroup(), false);
    window.addEventListener('resize', () => {
        scaleFrames();
        if (!document.getElementById('day').hidden) ensureDayTab();
    });

    // 폰에서 탭을 열어둔 채 날짜가 바뀌면 '오늘/내일'이 어제 기준으로 남으므로, 돌아올 때·1분마다 확인해 새로고침
    const recheck = () => { if (isoOf(new Date()) !== TODAY) location.reload(); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
    window.addEventListener('pageshow', e => { if (e.persisted) recheck(); });
    setInterval(recheck, 60 * 1000);
})();
</script>
</body>
</html>
